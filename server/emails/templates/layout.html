<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }}</title>
  <style>
    body { margin:0; padding:0; background:#0d0d0f; color:#e6e6e6; font-family:Inter, system-ui, sans-serif; }
    .wrapper { width:100%; max-width:680px; margin:0 auto; padding:28px 16px; }
    .panel { background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:32px; }
    h1 { margin:0 0 16px; font-size:28px; line-height:1.1; letter-spacing:0.04em; color:#ffffff; }
    p { margin:0 0 20px; color:#cfcfcf; line-height:1.6; }
    a.cta { display:inline-block; padding:12px 20px; border-radius:10px; background:#111; color:#fff; text-decoration:none; border:1px solid rgba(255,255,255,0.08); }
    .muted { color:#8f9599; font-size:13px; }
    .footer { margin-top:28px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.04); color:#8f9599; font-size:12px; line-height:1.5; }
    @media (max-width: 520px) {
      .panel { padding:22px; }
      h1 { font-size:24px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="panel">
      <h1>{{ title }}</h1>
      <p class="muted">{{ intro }}</p>
      <div>{{ body }}</div>
      <div style="margin-top:24px;"><a class="cta" href="{{ cta_url }}">{{ cta_text }}</a></div>
      <div class="footer">{{ footer_note }}</div>
    </div>
    <p class="muted" style="margin-top:20px;">© MAKWIN {{ year }}</p>
  </div>
</body>
</html>
